<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Μάθημα 19: Τα βασικά χαρακτηριστικά ενός δικτυακού τόπου</title>
  <style>
    :root {
      --primary: #0077FF;
      --primary-dark: #0056B3;
      --primary-light: #EBF4FF;
      --accent-cyan: #00D2D3;
      --accent-yellow: #FFD32A;
      --success: #10AC84;
      --danger: #FF4757;
      --bg: #F0F6FD;
      --card-bg: #FFFFFF;
      --text: #1E272C;
      --text-muted: #576574;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background-color: var(--bg); color: var(--text); padding-bottom: 30px; }

    header {
      background: linear-gradient(135deg, #0077FF 0%, #00C6FF 100%);
      color: white;
      padding: 16px 20px 22px;
      box-shadow: 0 4px 15px rgba(0, 119, 255, 0.25);
    }
    .header-top {
      max-width: 950px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title-box { display: flex; align-items: center; gap: 14px; }
    .header-icon {
      font-size: 2.2rem;
      background: rgba(255, 255, 255, 0.2);
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      backdrop-filter: blur(5px);
    }
    .header-title-box h1 { margin: 0; font-size: 1.45rem; font-weight: 800; letter-spacing: -0.5px; }
    .header-title-box p { margin: 3px 0 0; font-size: 0.95rem; opacity: 0.92; }

    .score-badge {
      background: white;
      color: var(--primary-dark);
      padding: 6px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .score-badge .star-icon { font-size: 1.3rem; color: #FFA502; }

    .nav-bar-container {
      max-width: 950px;
      margin: -12px auto 20px;
      padding: 0 15px;
    }
    .nav-bar {
      background: white;
      padding: 10px;
      border-radius: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 119, 255, 0.1);
      border: 2px solid #E1EDFA;
    }
    .nav-btn {
      background: var(--primary-light);
      border: 2px solid transparent;
      border-radius: 25px;
      padding: 8px 14px;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 700;
      color: var(--primary-dark);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nav-btn:hover { background: #D9EBFF; border-color: var(--primary); }
    .nav-btn.active {
      background: linear-gradient(135deg, #0077FF, #00A8FF);
      color: white;
      border-color: #0077FF;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 119, 255, 0.3);
    }

    main { max-width: 950px; margin: 0 auto; padding: 0 15px; }
    
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      border: 2px solid #DCEBFB;
      box-shadow: 0 8px 24px rgba(0, 119, 255, 0.08);
      position: relative;
    }

    .act-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #EEF5FD;
      padding-bottom: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .act-title-box { display: flex; align-items: center; gap: 10px; }
    .act-icon { font-size: 1.6rem; }
    .act-title { font-size: 1.25rem; font-weight: 800; color: var(--primary-dark); margin: 0; }
    .act-sub { font-size: 0.9rem; color: var(--text-muted); margin: 2px 0 0; }
    
    .level-badge {
      background: linear-gradient(135deg, #FF9F1A, #FFB142);
      color: white;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(255, 159, 26, 0.3);
    }

    .instructions {
      background: var(--primary-light);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.98rem;
      margin-bottom: 22px;
      border-left: 5px solid var(--primary);
      color: #0B3B60;
      line-height: 1.45;
    }

    .btn-action {
      background: linear-gradient(135deg, #10AC84, #1DD1A1);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 11px 24px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      box-shadow: 0 4px 12px rgba(16, 172, 132, 0.25);
      transition: all 0.2s;
    }
    .btn-action:hover { transform: translateY(-2px); opacity: 0.95; }
    .feedback {
      margin-top: 16px;
      font-weight: 700;
      font-size: 1.15rem;
      min-height: 32px;
      display: flex;
      align-items: center;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .option-card {
      background: white;
      border: 2px solid #E1EDFA;
      border-radius: 14px;
      padding: 18px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 3px 8px rgba(0, 119, 255, 0.04);
    }
    .option-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 119, 255, 0.12);
    }

    .browser-frame {
      border: 2px solid #C8DDF2;
      border-radius: 14px;
      overflow: hidden;
      background: white;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      margin: 15px 0;
    }
    .browser-toolbar {
      background: #E8F1FC;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #D6E6F8;
    }
    .browser-dots { display: flex; gap: 6px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot.red { background: #FF5F56; }
    .dot.yellow { background: #FFBD2E; }
    .dot.green { background: #27C93F; }
    .browser-nav-icons { display: flex; gap: 8px; font-size: 0.95rem; color: #576574; font-weight: bold; }
    .browser-url-bar {
      flex: 1;
      background: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid #C4DCF5;
      color: #1A365D;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .drag-items-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 60px;
      padding: 12px;
      background: #F4F9FF;
      border-radius: 14px;
      border: 2px dashed #99C5FE;
      margin-bottom: 20px;
      justify-content: center;
      align-items: center;
    }
    .draggable {
      background: white;
      border: 2px solid var(--primary);
      border-radius: 10px;
      padding: 9px 16px;
      cursor: grab;
      font-weight: 700;
      color: var(--primary-dark);
      user-select: none;
      box-shadow: 0 3px 6px rgba(0, 119, 255, 0.12);
    }
    .draggable:active { cursor: grabbing; transform: scale(1.03); }

    .drop-zone {
      min-width: 130px;
      min-height: 46px;
      border: 2px dashed #74B9FF;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #576574;
      text-align: center;
    }
    .drop-zone.filled {
      border-style: solid;
      border-color: var(--primary);
      background: #E1F0FF;
      color: var(--primary-dark);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="header-title-box">
        <div class="header-icon">🧭</div>
        <div>
          <h1>Μάθημα 19: Τα βασικά χαρακτηριστικά ενός δικτυακού τόπου</h1>
          <p>Πληροφορική Γ' Δημοτικού • Μάθε για το URL, τον ιδιοκτήτη, τη δομή και το μενού!</p>
        </div>
      </div>
      <div class="score-badge">
        <span class="star-icon">⭐</span>
        <span>Αστέρια: <span id="starsCount">0</span></span>
      </div>
    </div>
  </header>

  <div class="nav-bar-container">
    <div class="nav-bar" id="navBar"></div>
  </div>

  <main>
    <div class="card" id="activityBox"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div style="font-size:3.5rem;">🎉🌟</div>
      <h2 style="color:var(--primary-dark); margin:10px 0;">Εξαιρετικά!</h2>
      <p style="font-size:1.1rem; color:#4B6584;" id="modalMsg">Κέρδισες ένα νέο αστέρι!</p>
      <button class="btn-action" onclick="closeModal()">Συνέχεια</button>
    </div>
  </div>

  <script>
    let currentActivity = 0;
    let activityLevel = [1, 1, 1, 1, 1, 1, 1];
    let stars = 0;

    const activities = [
      // 1. Ποια είναι η Διεύθυνση (URL);
      {
        title: "1. Η Διεύθυνση ενός Δικτυακού Τόπου (URL)",
        sub: "Αναγνώρισε τη μοναδική διεύθυνση στον παγκόσμιο ιστό",
        render: function(lvl) {
          const qs = [
            {
              desc: "Ποια από τις παρακάτω μορφές είναι μια <strong>έγκυρη διεύθυνση δικτυακού τόπου (URL)</strong> για ένα δημοτικό σχολείο;",
              options: [
                "https://dim-athinon.sch.gr",
                "Οδός Σταδίου 12, Αθήνα",
                "Τηλέφωνο: 210-999999"
              ],
              correct: "https://dim-athinon.sch.gr"
            },
            {
              desc: "Τι δείχνουν συνήθως τα γράμματα <strong>URL</strong> (Uniform Resource Locator) στον φυλλομετρητή μας;",
              options: [
                "Τη μοναδική διεύθυνση που ορίζει πού βρίσκεται ο ιστότοπος",
                "Το χρώμα της οθόνης του υπολογιστή",
                "Την ώρα που κλείνει το σχολείο"
              ],
              correct: "Τη μοναδική διεύθυνση που ορίζει πού βρίσκεται ο ιστότοπος"
            },
            {
              desc: "Είναι αλήθεια ότι κάθε ιστοσελίδα έχει τη δική της <strong>μοναδική διεύθυνση</strong> στο διαδίκτυο;",
              options: [
                "Ναι, κάθε ιστοσελίδα έχει μοναδική διεύθυνση!",
                "Όχι, όλες οι σελίδες στον κόσμο έχουν την ίδια διεύθυνση."
              ],
              correct: "Ναι, κάθε ιστοσελίδα έχει μοναδική διεύθυνση!"
            }
          ];
          const curr = qs[lvl - 1];

          return `
            <div class="act-header">
              <div class="act-title-box">
                <span class="act-icon">🔗</span>
                <div>
                  <h2 class="act-title">${this.title}</h2>
                  <p class="act-sub">${this.sub}</p>
                </div>
              </div>
              <span class="level-badge">Επίπεδο ${lvl}/3</span>
            </div>
            <div class="instructions">
              Η διεύθυνση (URL) είναι σαν τη διεύθυνση του σπιτιού μας, αλλά για τον παγκόσμιο ιστό! Διάβασε την ερώτηση και διάλεξε τη σωστή απάντηση.
            </div>
            <p style="font-size:1.25rem; text-align:center; margin:30px 0; color:#0A3D62; font-weight:600;">
              ${curr.desc}
            </p>
            <div class="options-grid">
              ${curr.options.map(opt => `
                <div class="option-card" onclick="checkAct1('${opt}', '${curr.correct}',${lvl})">
                  <h3 style="color:var(--primary-dark); margin:0;">${opt}</h3>
                </div>
              `).join('')}
            </div>
            <div class="feedback" id="fb"></div>
          `;
        }
      },

      // 2. Ποιος είναι ο Ιδιοκτήτης του Ιστότοπου;
      {
        title: "2. Ο Ιδιοκτήτης του Δικτυακού Τόπου",
        sub: "Ποιος διαχειρίζεται και κατέχει τον ιστότοπο;",
        render: function(lvl) {
          const sites = [
            {
              url: "https://dimotiko-vyrona.sch.gr",
              title: "Δημοτικό Σχολείο Βύρωνα",
              q: "Ποιος είναι ο <strong>ιδιοκτήτης</strong> αυτού του δικτυακού τόπου;",
              options: ["Το Δημοτικό Σχολείο Βύρωνα", "Ένα κατάστημα με παπούτσια", "Ένα μουσείο παιχνιδιών"],
              correct: "Το Δημοτικό Σχολείο Βύρωνα"
            },
            {
              url: "https://www.namuseum.gr",
              title: "Εθνικό Αρχαιολογικό Μουσείο",
              q: "Ποιος είναι ο <strong>ιδιοκτήτης</strong> αυτού του δικτυακού τόπου;",
              options: ["Το Εθνικό Αρχαιολογικό Μουσείο", "Μία αεροπορική εταιρεία", "Μία ποδοσφαιρική ομάδα"],
              correct: "Το Εθνικό Αρχαιολογικό Μουσείο"
            },
            {
              url: "https://www.e-me.edu.gr",
              title: "Ψηφιακή Εκπαιδευτική Πλατφόρμα e-me",
              q: "Ο ιδιοκτήτης ενός δικτυακού τόπου μπορεί να είναι:",
              options: ["Μία εταιρεία, οργάνωση ή και ένα μόνο άτομο", "Μόνο ένας υπολογιστής χωρίς άνθρωπο"],
              correct: "Μία εταιρεία, οργάνωση ή και ένα μόνο άτομο"
            }
          ];
          const curr = sites[lvl - 1];

          return `
            <div class="act-header">
              <div class="act-title-box">
                <span class="act-icon">👤</span>
                <div>
                  <h2 class="act-title">${this.title}</h2>
                  <p class="act-sub">${this.sub}</p>
                </div>
              </div>
              <span class="level-badge">Επίπεδο ${lvl}/3</span>
            </div>
            <div class="instructions">
              Ο ιδιοκτήτης κατέχει και ενημερώνει τον ιστότοπο. Παρατήρησε τη διεύθυνση και βρες ποιος είναι ο ιδιοκτήτης!
            </div>
            <div class="browser-frame" style="max-width:650px; margin:20px auto;">
              <div class="browser-toolbar">
                <div class="browser-dots">
                  <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
                </div>
                <div class="browser-url-bar">🔒 ${curr.url}</div>
              </div>
              <div style="padding:15px; text-align:center; background:#FAFCFE;">
                <h2 style="color:var(--primary-dark); margin:0;">${curr.title}</h2>
              </div>
            </div>
            <p style="font-size:1.2rem; text-align:center; margin:20px 0; color:#0A3D62; font-weight:600;">
              ${curr.q}
            </p>
            <div class="options-grid">
              ${curr.options.map(opt => `
                <div class="option-card" onclick="checkAct2('${opt}', '${curr.correct}',${lvl})">
                  <h3 style="color:var(--primary-dark); margin:0;">${opt}</h3>
                </div>
              `).join('')}
            </div>
            <div class="feedback" id="fb"></div>
          `;
        }
      },

      // 3. Η Δομή ενός Δικτυακού Τόπου
      {
        title: "3. Η Δομή ενός Δικτυακού Τόπου",
        sub: "Πώς οργανώνονται οι ιστοσελίδες;",
        render: function(lvl) {
          const structures = [
            {
              desc: "Ένας ιστότοπος παρουσιάζει τη ζωή ενός ιστορικού προσώπου και διαβάζουμε τις σελίδες <strong>τη μία μετά την άλλη με τη σειρά</strong>.",
              correct: "Γραμμική Δομή",
              hint: "Μοιάζει με ένα παραμύθι ή βιβλίο που διαβάζεται σε ευθεία γραμμή!"
            },
            {
              desc: "Ο ιστότοπος του σχολείου έχει κατηγορίες, και κάθε κατηγορία έχει υποκατηγορίες, απλώνοντας <strong>σαν δέντρο με κλαδιά</strong>.",
              correct: "Δενδροειδής Δομή (Ιεραρχική)",
              hint: "Ξεκινάει από την αρχική σελίδα και διακλαδίζεται προς τα κάτω!"
            },
            {
              desc: "Ένα ηλεκτρονικό κατάστημα χωρίζει τα προϊόντα σε <strong>Κατηγορίες</strong> (π.χ. Ρούχα ➔ Μπλούζες, Παντελόνια).",
              correct: "Δομή με Κατηγορίες",
              hint: "Οργανώνει τα προϊόντα ανά είδος για να τα βρίσκουμε εύκολα!"
            }
          ];
          const curr = structures[lvl - 1];

          return `
            <div class="act-header">
              <div class="act-title-box">
                <span class="act-icon">🌳</span>
                <div>
                  <h2 class="act-title">${this.title}</h2>
                  <p class="act-sub">${this.sub}</p>
                </div>
              </div>
              <span class="level-badge">Επίπεδο ${lvl}/3</span>
            </div>
            <div class="instructions">
              Η δομή δείχνει πώς οργανώνονται οι σελίδες μέσα σε ένα website. Διάβασε την περιγραφή και βρες το είδος της δομής!
            </div>
            <p style="font-size:1.25rem; text-align:center; margin:30px 0; color:#0A3D62; font-weight:600;">
              «${curr.desc}»
            </p>
            <div class="options-grid">
              <div class="option-card" onclick="checkAct3('Γραμμική Δομή', '${curr.correct}', ${lvl})">
                <div style="font-size:2.2rem; margin-bottom:5px;">➡️</div>
                <h3 style="color:#0056B3; margin:0 0 5px;">Γραμμική Δομή</h3>
                <p style="color:#666; font-size:0.85rem; margin:0;">Σελίδες στη σειρά, σαν βιβλίο</p>
              </div>
              <div class="option-card" onclick="checkAct3('Δενδροειδής Δομή (Ιεραρχική)', '${curr.correct}', ${lvl})">
                <div style="font-size:2.2rem; margin-bottom:5px;">🌲</div>
                <h3 style="color:#0077FF; margin:0 0 5px;">Δενδροειδής Δομή</h3>
                <p style="color:#666; font-size:0.85rem; margin:0;">Σαν δέντρο με κλαδιά και υποκατηγορίες</p>
              </div>
              <div class="option-card" onclick="checkAct3('Δομή με Κατηγορίες', '${curr.correct}', ${lvl})">
                <div style="font-size:2.2rem; margin-bottom:5px;">🛍️</div>
                <h3 style="color:#0084FF; margin:0 0 5px;">Δομή με Κατηγορίες</h3>
                <p style="color:#666; font-size:0.85rem; margin:0;">Ομαδοποίηση σε είδη (π.χ. κατάστημα)</p>
              </div>
            </div>
            <div class="feedback" id="fb"></div>
          `;
        }
      },

      // 4. Drag & Drop: Τα Μέρη ενός Δικτυακού Τόπου
      {
        title: "4. Τα Μέρη ενός Δικτυακού Τόπου",
        sub: "Τοποθέτησε τα στοιχεία στη σωστή θέση της οθόνης",
        render: function(lvl) {
          return `
            <div class="act-header">
              <div class="act-title-box">
                <span class="act-icon">🧩</span>
                <div>
                  <h2 class="act-title">${this.title}</h2>
                  <p class="act-sub">${this.sub}</p>
                </div>
              </div>
              <span class="level-badge">Επίπεδο ${lvl}/1</span>
            </div>
            <div class="instructions">
              Σύρε τα πλακίδια στα κατάλληλα σημεία του παραθύρου (όπως φαίνεται στη σελ. 76 του βιβλίου):
            </div>
            <div class="drag-items-pool" id="pool">
              <div class="draggable" draggable="true" ondragstart="drag(event)" id="part-url">Διεύθυνση Δικτυακού Τόπου (URL)</div>
              <div class="draggable" draggable="true" ondragstart="drag(event)" id="part-name">Όνομα Δικτυακού Τόπου</div>
              <div class="draggable" draggable="true" ondragstart="drag(event)" id="part-menu">Μενού Επιλογών (Menu)</div>
            </div>
            <div class="browser-frame">
              <div class="browser-toolbar">
                <div class="browser-dots">
                  <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
                </div>
                <div class="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" data-expected="Διεύθυνση Δικτυακού Τόπου (URL)" style="flex:1;">
                  [ Θέση: URL / Διεύθυνση ]
                </div>
              </div>
              <div style="padding:15px; background:#FAFCFE; text-align:center;">
                <div class="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" data-expected="Όνομα Δικτυακού Τόπου" style="margin:0 auto 15px; width:60%;">
                  [ Θέση: Όνομα Ιστότοπου ]
                </div>
                <div class="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" data-expected="Μενού Επιλογών (Menu)" style="margin:0 auto; width:90%; background:#FFF9E6;">
                  [ Θέση: Μενού Επιλογών ]
                </div>
                <div style="margin-top:20px; color:#A0AEC0; font-size:0.9rem;">
                  (Εδώ εμφανίζεται το περιεχόμενο της αρχικής σελίδας)
                </div>
              </div>
            </div>
            <button class="btn-action" onclick="checkAct4()">Έλεγχος Στοιχείων</button>
            <div class="feedback" id="fb"></div>
          `;
        }
      },

      // 5. Το Μενού Επιλογών (Menu Exploration)
      {
        title: "5. Το Μενού Επιλογών (Menu)",
        sub: "Βρες την κατάλληλη κατηγορία στο μενού",
        render: function(lvl) {
          const tasks = [
            {
              mission: "Θέλεις να μάθεις ποιοι είναι οι δάσκαλοι και οι δασκάλες του σχολείου φέτος.",
              correctMenu: "Εκπαιδευτικοί",
              options: ["Αρχική", "Εκπαιδευτικοί", "Ανακοινώσεις", "Επικοινωνία"]
            },
            {
              mission: "Θέλεις να διαβάσεις για την τελευταία σχολική εκδρομή και την ανακοίνωση για την αργία.",
              correctMenu: "Ανακοινώσεις",
              options: ["Ανακοινώσεις", "Μαθήματα/Τάξεις", "Το σχολείο μας", "Επικοινωνία"]
            },
            {
              mission: "Θέλεις να βρεις το τηλέφωνο και τη διεύθυνση του σχολείου για να επικοινωνήσει η μαμά σου.",
              correctMenu: "Επικοινωνία",
              options: ["Δράσεις", "Εκπαιδευτικοί", "Επικοινωνία", "Αρχική"]
            }
          ];
          const curr = tasks[lvl - 1];

          return `
            <div class="act-header">
              <div class="act-title-box">
                <span class="act-icon">📋</span>
                <div>
                  <h2 class="act-title">${this.title}</h2>
                  <p class="act-sub">${this.sub}</p>
                </div>
              </div>
              <span class="level-badge">Επίπεδο ${lvl}/3</span>
            </div>
            <div class="instructions">
              Το <strong>μενού επιλογών</strong> περιλαμβάνει συνδέσμους που οδηγούν στις διάφορες ενότητες του ιστότοπου. Ποια επιλογή του μενού θα πατήσεις;
            </div>
            <div style="background:#EBF4FF; border-left:4px solid var(--primary); padding:18px; border-radius:10px; margin:20px 0;">
              <p style="font-size:1.15rem; margin:0; color:#1A365D;"><strong>Αποστολή:</strong> ${curr.mission}</p>
            </div>
            <p style="font-size:1.2rem; font-weight:700; color:var(--primary-dark); text-align:center;">
              Κάνε κλικ στο σωστό κουμπί του μενού:
            </p>
            <div class="options-grid">
              ${curr.options.map(opt => `
                <div class="option-card" onclick="checkAct5('${opt}', '${curr.correctMenu}',${lvl})">
                  <h3 style="color:var(--primary-dark); margin:0;">📌 ${opt}</h3>
                </div>
              `).join('')}
            </div>
            <div class="feedback" id="fb"></div>
          `;
        }
      },

      // 6. Βρες τον Εισβολέα στο Μενού
      {
        title: "6. Βρες τον Εισβολέα στο Μενού",
        sub: "Ποια επιλογή δεν ταιριάζει;",
        render: function(lvl) {
          const menus = [
            {
              site: "🏫 Μενού Σχολικού Ιστότοπου:",
              items: ["Αρχική", "Οι Τάξεις μας", "Παιχνιδοκονσόλες προς πώληση", "Ανακοινώσεις"],
              wrong: "Παιχνιδοκονσόλες προς πώληση"
            },
            {
              site: "🏛️ Μενού Ιστότοπου Μουσείου:",
              items: ["Εκθέματα", "Ωράριο Εισόδου", "Εισιτήρια", "Επισκευές Ποδηλάτων"],
              wrong: "Επισκευές Ποδηλάτων"
            },
            {
              site: "🍕 Μενού Ιστότοπου Πιτσαρίας:",
              items: ["Πίτσες", "Σαλάτες", "Αρχαία Αγάλματα", "Προσφορές"],
              wrong: "Αρχαία Αγάλματα"
            }
          ];
          const curr = menus[lvl - 1];

          return `
            <div class="act-header">
              <div class="act-title-box">
                <span class="act-icon">🕵️</span>
                <div>
                  <h2 class="act-title">${this.title}</h2>
                  <p class="act-sub">${this.sub}</p>
                </div>
              </div>
              <span class="level-badge">Επίπεδο ${lvl}/3</span>
            </div>
            <div class="instructions">
              Κάποια επιλογή μπήκε κατά λάθος στο μενού και δεν ταιριάζει με τον ιστότοπο. <strong>Κάνε κλικ στον εισβολέα!</strong>
            </div>
            <h3 style="text-align:center; color:var(--primary); margin:20px 0;">${curr.site}</h3>
            <div class="options-grid">
              ${curr.items.map(it => `
                <div class="option-card" onclick="checkAct6('${it}', '${curr.wrong}',${lvl})">
                  <h3 style="color:var(--primary-dark); margin:0;">🔘 ${it}</h3>
                </div>
              `).join('')}
            </div>
            <div class="feedback" id="fb"></div>
          `;
        }
      },

      // 7. Συναρμολόγησε την Αρχική Σελίδα!
      {
        title: "7. Συναρμολόγησε την Αρχική Σελίδα!",
        sub: "Φτιάξε τον ιστότοπο τοποθετώντας τα κομμάτια στη θέση τους",
        render: function(lvl) {
          const parts = [
            { text: "🔗 https://dimotiko-scholeio.gr" },
            { text: "🏫 Δημοτικό Σχολείο (Όνομα)" },
            { text: "📋 Αρχική | Τάξεις | Δράσεις | Επικοινωνία" },
            { text: "📰 Άρθρο: Καλωσήρθατε στο σχολείο μας!" }
          ];

          return `
            <div class="act-header">
              <div class="act-title-box">
                <span class="act-icon">🧩</span>
                <div>
                  <h2 class="act-title">${this.title}</h2>
                  <p class="act-sub">${this.sub}</p>
                </div>
              </div>
              <span class="level-badge">Επίπεδο ${lvl}/1</span>
            </div>
            <div class="instructions">
              Βοήθησε να συναρμολογηθεί η αρχική σελίδα του σχολείου! <strong>Σύρε και τα 4 κομμάτια</strong> από την αποθήκη στα σωστά πλαίσια του Browser:
            </div>
            <div class="drag-items-pool" id="pool">
              ${parts.map((p, i) => `
                <div class="draggable" draggable="true" ondragstart="drag(event)" id="drag-p-${i}">${p.text}</div>
              `).join('')}
            </div>
            <div class="browser-frame" style="max-width:750px; margin:0 auto;">
              <div class="browser-toolbar">
                <div class="browser-dots">
                  <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
                </div>
                <div class="browser-nav-icons">◀ ▶ 🔄</div>
                <div class="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" data-expected="🔗 https://dimotiko-scholeio.gr" style="flex:1; min-height:36px;">
                  [ Σύρε εδώ τη Διεύθυνση URL ]
                </div>
              </div>
              <div style="padding:15px; background:#FAFCFE; display:flex; flex-direction:column; gap:12px;">
                <div class="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" data-expected="🏫 Δημοτικό Σχολείο (Όνομα)" style="width:100%; min-height:48px; background:#FFF9E6;">
                  [ Σύρε εδώ το Όνομα / Λογότυπο του Σχολείου ]
                </div>
                <div class="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" data-expected="📋 Αρχική | Τάξεις | Δράσεις | Επικοινωνία" style="width:100%; min-height:44px; background:#EBF4FF;">
                  [ Σύρε εδώ το Μενού Επιλογών ]
                </div>
                <div class="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)" data-expected="📰 Άρθρο: Καλωσήρθατε στο σχολείο μας!" style="width:100%; min-height:90px;">
                  [ Σύρε εδώ το Κεντρικό Περιεχόμενο ]
                </div>
              </div>
            </div>
            <div style="text-align:center;">
              <button class="btn-action" onclick="checkAct7()">Έλεγχος Συναρμολόγησης</button>
            </div>
            <div class="feedback" id="fb" style="justify-content:center;"></div>
          `;
        }
      }
    ];

    function initNav() {
      const nav = document.getElementById('navBar');
      nav.innerHTML = activities.map((act, i) => `
        <button class="nav-btn ${i === currentActivity ? 'active' : ''}" onclick="goToAct(${i})">
          <span>${i + 1}.</span> ${act.title.split('.')[1] || act.title}
        </button>
      `).join('');
    }

    function goToAct(i) {
      currentActivity = i;
      initNav();
      renderCurrent();
    }

    function renderCurrent() {
      const box = document.getElementById('activityBox');
      box.innerHTML = activities[currentActivity].render(activityLevel[currentActivity]);
    }

    function awardStar(customMsg) {
      stars++;
      document.getElementById('starsCount').innerText = stars;
      showModal(customMsg || "🎉 Μπράβο! Κέρδισες ένα αστέρι γνώσης!");
    }

    function showModal(msg) {
      document.getElementById('modalMsg').innerText = msg;
      document.getElementById('modalOverlay').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    // Act 1
    function checkAct1(choice, correct, lvl) {
      const fb = document.getElementById('fb');
      if (choice === correct) {
        fb.innerHTML = "<span style='color:var(--success)'>🎉 Πολύ σωστά! Αυτό είναι το URL!</span>";
        setTimeout(() => {
          if (lvl < 3) { activityLevel[0]++; renderCurrent(); }
          else { awardStar(); }
        }, 1200);
      } else {
        fb.innerHTML = "<span style='color:var(--danger)'>❌ Ξανασκέψου το: Πώς ξεκινάει μια διεύθυνση ιστοσελίδας;</span>";
      }
    }

    // Act 2
    function checkAct2(choice, correct, lvl) {
      const fb = document.getElementById('fb');
      if (choice === correct) {
        fb.innerHTML = "<span style='color:var(--success)'>✨ Μπράβο! Βρήκες τον ιδιοκτήτη!</span>";
        setTimeout(() => {
          if (lvl < 3) { activityLevel[1]++; renderCurrent(); }
          else { awardStar(); }
        }, 1200);
      } else {
        fb.innerHTML = "<span style='color:var(--danger)'>❌ Κοίταξε ξανά προσεκτικά το όνομα και τη διεύθυνση URL.</span>";
      }
    }

    // Act 3
    function checkAct3(choice, correct, lvl) {
      const fb = document.getElementById('fb');
      if (choice === correct) {
        fb.innerHTML = "<span style='color:var(--success)'>🌳 Ακριβώς! Αυτό είναι το είδος της δομής!</span>";
        setTimeout(() => {
          if (lvl < 3) { activityLevel[2]++; renderCurrent(); }
          else { awardStar(); }
        }, 1200);
      } else {
        fb.innerHTML = "<span style='color:var(--danger)'>❌ Ξανασκέψου το: Είναι σε σειρά (γραμμική) ή σαν κλαδιά (δενδροειδής);</span>";
      }
    }

    // Drag and drop standard
    function allowDrop(e) { e.preventDefault(); }
    function drag(e) { e.dataTransfer.setData("text", e.target.id); }
    function drop(e) {
      e.preventDefault();
      const id = e.dataTransfer.getData("text");
      const el = document.getElementById(id);
      if (!el) return;
      if (e.target.classList.contains('drop-zone')) {
        e.target.innerText = el.innerText;
        e.target.setAttribute('data-val', el.innerText);
        e.target.classList.add('filled');
        el.style.display = 'none';
      }
    }

    // Act 4
    function checkAct4() {
      const zones = document.querySelectorAll('.browser-frame .drop-zone');
      let ok = true, filled = 0;
      zones.forEach(z => {
        const val = z.getAttribute('data-val');
        const exp = z.getAttribute('data-expected');
        if (val) filled++;
        if (val !== exp) ok = false;
      });
      const fb = document.getElementById('fb');
      if (filled === 3 && ok) {
        fb.innerHTML = "<span style='color:var(--success)'>🌟 Εξαιρετικά! Έμαθες όλα τα μέρη ενός δικτυακού τόπου!</span>";
        setTimeout(awardStar, 1200);
      } else {
        fb.innerHTML = "<span style='color:var(--danger)'>⚠️ Κάποιο στοιχείο είναι σε λάθος θέση. Έλεγξε ξανά!</span>";
      }
    }

    // Act 5
    function checkAct5(choice, correct, lvl) {
      const fb = document.getElementById('fb');
      if (choice === correct) {
        fb.innerHTML = "<span style='color:var(--success)'>🎯 Μπράβο! Αυτή είναι η σωστή επιλογή στο μενού!</span>";
        setTimeout(() => {
          if (lvl < 3) { activityLevel[4]++; renderCurrent(); }
          else { awardStar(); }
        }, 1200);
      } else {
        fb.innerHTML = "<span style='color:var(--danger)'>❌ Σε αυτή την ενότητα βρίσκονται άλλες πληροφορίες. Δοκίμασε άλλη επιλογή!</span>";
      }
    }

    // Act 6 (Πρώην 7 - Βρες τον εισβολέα)
    function checkAct6(selected, wrong, lvl) {
      const fb = document.getElementById('fb');
      if (selected === wrong) {
        fb.innerHTML = "<span style='color:var(--success)'>🕵️ Μπράβο! Βρήκες τον εισβολέα στο μενού!</span>";
        setTimeout(() => {
          if (lvl < 3) { activityLevel[5]++; renderCurrent(); }
          else { awardStar(); }
        }, 1200);
      } else {
        fb.innerHTML = "<span style='color:var(--danger)'>❌ Αυτή η επιλογή ταιριάζει κανονικά. Ψάξε εκείνη που είναι άσχετη!</span>";
      }
    }

    // Act 7 (Πρώην 8 - Συναρμολόγηση Αρχικής Σελίδας)
    function checkAct7() {
      const zones = document.querySelectorAll('.browser-frame .drop-zone');
      let ok = true, filled = 0;
      zones.forEach(z => {
        const val = z.getAttribute('data-val');
        const exp = z.getAttribute('data-expected');
        if (val) filled++;
        if (val !== exp) ok = false;
      });
      const fb = document.getElementById('fb');
      if (filled === 4 && ok) {
        fb.innerHTML = "<span style='color:var(--success)'>🎉 Τέλεια! Συναρμολόγησες ολόκληρη την αρχική σελίδα του σχολείου!</span>";
        setTimeout(awardStar, 1200);
      } else {
        fb.innerHTML = "<span style='color:var(--danger)'>⚠️ Συμπλήρωσε και τα 4 τμήματα στη σωστή τους θέση.</span>";
      }
    }

    initNav();
    renderCurrent();
  </script>
</body>
</html>
