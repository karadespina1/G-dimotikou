.back:hover{background:var(--ac2)}
.crumb{color:var(--mu);font-size:.9rem;margin:0 0 4px}
#view h2{margin:0 0 14px;font-size:1.35rem}
.obj{border-left:6px solid var(--uc)!important;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:inherit}
.obj:hover{transform:translateY(-2px);box-shadow:0 2px 10px rgba(0,0,0,.08)}

const $=s=>document.querySelector(s);
const all=DATA.units.flatMap((u,i)=>u.l.map(l=>({...l,ui:i+1,ut:u.t})));
const ICONS=[[/^Βίντεο/,"🎬"],[/^Παιχνίδι|^Εκπαιδευτικό παιχνίδι/,"🎮"],[/^Κουίζ/,"❓"],[/^Τεστ/,"📝"],[/^Άσκηση/,"✏️"],[/^Διαδραστικ/,"🖱️"],[/^Εικόνα/,"🖼️"],[/^Αφίσα/,"🪧"],[/ρόλεξο|^Κρυπτ/,"🔤"],[/^Εφαρμογή|^Ψηφιακή πλατφόρμα|ScratchJr/,"💻"],[/^Κάρτες/,"🃏"],[/^Παρουσίαση/,"📊"],[/βιβλί/,"📚"]];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function icon(t){for(const[r,i]of ICONS)if(r.test(t))return i;return"🔗"}
function split(t){const m=t.match(/^((?:Άσκηση|Βίντεο|Παιχνίδι|Εκπαιδευτικό παιχνίδι|Εικόνα|Διαδραστική εικόνα|Εικόνα \(διαδραστική\)|Τεστ αξιολόγησης)[^.:]{0,25})[.:]\s+(.+)$/);return m?[m[1],m[2]]:["",t]}
function actHTML(l){return l.o.length?l.o.map(o=>{const[ty,ti]=split(o.t);return`<a class="obj" href="${esc(o.u)}" target="_blank" rel="noopener noreferrer"><span class="ic">${icon(o.t)}</span><span><div class="ot">${esc(ti)}</div><div class="ty">${ty?esc(ty)+" · ":""}σελ. ${o.p}</div></span><span class="go">Άνοιγμα ↗</span></a>`}).join(""):`<p class="empty">Αυτό το μάθημα δεν έχει QR codes.</p>`}
function renderList(){
 $("#list").innerHTML=DATA.units.map((u,i)=>`<div class="unit" style="--uc:${UC[i]}"><h2><span class="k">Ενότητα ${i+1}</span>${esc(u.t)}</h2><ul class="lessons">`+
 u.l.map(l=>`<li id="m${l.n}"><button aria-expanded="false" aria-controls="a${l.n}" data-n="${l.n}"><span class="num">${l.n}</span><span>${esc(l.t)}</span><span class="cnt">${l.o.length} δραστ.</span><span class="chev">▾</span></button><div class="acts" id="a${l.n}">${actHTML(l)}</div></li>`).join("")+`</ul></div>`).join("");
 $("#list").querySelectorAll("button[data-n]").forEach(b=>b.onclick=()=>{const li=b.parentElement,o=li.classList.toggle("open");b.setAttribute("aria-expanded",o)});
}
renderList();
</script>
</body>
</html>
